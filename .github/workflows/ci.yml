name: CI

on:
  push:
  pull_request:
  # M16-HARNESS-09：nightly / RC 复用本 PR 层（CI-LAYERS.md 四层模型）。
  workflow_call:

permissions:
  contents: read

# AGENTS.md §3.1：backend/.cargo/config.toml 把 target-dir 固定为开发机路径
# /data/cargo-target/bblbb（保护根分区）；CI runner 无权创建 /data
# （Permission denied，Rust/跨库迁移 job 全灭）。Cargo 环境变量优先于
# config 文件，CI 统一覆盖为工作区可写路径，本地开发行为不受影响；
# 编译提速由下方各 job 的 target-dir 缓存 + sccache 保证（AGENTS.md §3.4）。
env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  contracts:
    name: Documentation and OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check local Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            './README.md'
            './docs/**/*.md'
            './dev/**/*.md'
          fail: true

      - name: Parse OpenAPI YAML
        shell: ruby {0}
        run: |
          require "yaml"
          document = YAML.safe_load(File.read("openapi/openapi.yaml"), aliases: true)
          abort "OpenAPI document must be a mapping" unless document.is_a?(Hash)
          abort "Missing OpenAPI version" unless document.fetch("openapi", "").start_with?("3.")
          abort "Missing OpenAPI paths" unless document["paths"].is_a?(Hash)

      - name: Check OpenAPI operation coverage
        run: ruby scripts/sync-operation-coverage.rb --check

      - name: Run contract governance suite
        run: |
          ruby scripts/check-openapi.rb
          ruby scripts/check-error-codes.rb
          ruby scripts/check-code-fixtures.rb
          ruby scripts/check-state-machine-matrix.rb
          ruby scripts/check-client-compat.rb
          ruby scripts/check-secrets.rb
          ruby scripts/check-write-contract.rb
          ruby scripts/check-route-coverage.rb
          ruby scripts/check-permission-matrix.rb
          ruby scripts/check-state-enums.rb
          ruby scripts/generate-ts-types.rb --check

      - name: Check roadmap consistency
        run: ruby scripts/check-roadmap.rb

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    env:
      # sccache 默认缓存上限 10GiB，runner 总磁盘仅 14GB：clippy 阶段即可写满
      # 导致后续 cargo test codegen 阶段 No space left on device。压到 4GiB
      # 仍保留跨 run 命中收益（AGENTS.md §3.4，仅改缓存容量，不删缓存步骤）。
      SCCACHE_CACHE_SIZE: 4GiB
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ hashFiles('Cargo.toml', 'backend/Cargo.toml') != '' }}
        with:
          components: rustfmt, clippy
      # AGENTS.md §3.4：sccache + cargo 依赖缓存（全量编译从数十分钟降到增量）
      - name: Install sccache
        if: ${{ hashFiles('Cargo.toml', 'backend/Cargo.toml') != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y sccache
          sccache --version
      - name: Cache sccache build cache
        if: ${{ hashFiles('Cargo.toml', 'backend/Cargo.toml') != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: sccache-${{ runner.os }}-
      - name: Cache cargo registry and git deps
        if: ${{ hashFiles('Cargo.toml', 'backend/Cargo.toml') != '' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-deps-${{ runner.os }}-
      # AGENTS.md §3.4：CI target-dir 缓存（配合 workflow 级 CARGO_TARGET_DIR 覆盖）
      - name: Cache cargo target dir
        if: ${{ hashFiles('Cargo.toml', 'backend/Cargo.toml') != '' }}
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-${{ runner.os }}-
      - name: Check Rust workspace (fmt + clippy)
        if: ${{ hashFiles('Cargo.toml') != '' }}
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_IDLE_TIMEOUT: "0"
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      # 与 backend 变体相同：分批复用 rlib，限制磁盘占用（见 [profile.test]）。
      - name: Test Rust workspace (chunked for bounded disk)
        if: ${{ hashFiles('Cargo.toml') != '' }}
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_IDLE_TIMEOUT: "0"
        run: |
          set -euo pipefail
          mapfile -t TESTS < <(cargo metadata --format-version 1 --no-deps -q | jq -r '.workspace_members[] as $w | .packages[] | select(.id == $w) | .targets[] | select(.kind | index("test")) | .name')
          total=${#TESTS[@]}
          chunk=40
          i=0
          while [ "$i" -lt "$total" ]; do
            args=()
            batch=()
            for ((k = i; k < i + chunk && k < total; k++)); do
              args+=(--test "${TESTS[k]}")
              batch+=("${TESTS[k]}")
            done
            echo "::group::test batch ($(($i + 1))..$((i + ${#batch[@]}))/$total)"
            cargo test "${args[@]}" --all-features
            for t in "${batch[@]}"; do
              find "${CARGO_TARGET_DIR:-target}/debug/deps" -maxdepth 1 -type f -executable -name "${t}-*" -size +1M -delete
            done
            echo "::endgroup::"
            i=$((i + chunk))
          done
          cargo test --lib --bins --all-features
      - name: Check Rust backend (fmt + clippy)
        if: ${{ hashFiles('Cargo.toml') == '' && hashFiles('backend/Cargo.toml') != '' }}
        working-directory: backend
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_IDLE_TIMEOUT: "0"
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      # runner 14GB 磁盘装不下 clippy rmeta + rlib + 148 个测试可执行文件
      # （每个静态链接整棵依赖树，见 Cargo.toml [profile.test] 注释）。
      # 测试 target 分 4 批运行，每批结束删除本批可执行文件（rlib/rmeta
      # 共享保留，下一批复用），lib/bins 单元测试单独跑。
      - name: Test Rust workspace (chunked for bounded disk)
        if: ${{ hashFiles('Cargo.toml') == '' && hashFiles('backend/Cargo.toml') != '' }}
        working-directory: backend
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_IDLE_TIMEOUT: "0"
        run: |
          set -euo pipefail
          mapfile -t TESTS < <(cargo metadata --format-version 1 --no-deps -q | jq -r '.workspace_members[] as $w | .packages[] | select(.id == $w) | .targets[] | select(.kind | index("test")) | .name')
          total=${#TESTS[@]}
          chunk=40
          i=0
          while [ "$i" -lt "$total" ]; do
            args=()
            batch=()
            for ((k = i; k < i + chunk && k < total; k++)); do
              args+=(--test "${TESTS[k]}")
              batch+=("${TESTS[k]}")
            done
            echo "::group::test batch ($(($i + 1))..$((i + ${#batch[@]}))/$total)"
            cargo test "${args[@]}" --all-features
            # 只删本批测试可执行文件（按 target 名精确匹配，保留 rlib/rmeta/.so）
            for t in "${batch[@]}"; do
              find "${CARGO_TARGET_DIR:-target}/debug/deps" -maxdepth 1 -type f -executable -name "${t}-*" -size +1M -delete
            done
            echo "::endgroup::"
            i=$((i + chunk))
          done
          cargo test --lib --bins --all-features
      - name: Note absent Rust project
        if: ${{ hashFiles('Cargo.toml', 'backend/Cargo.toml') == '' }}
        run: echo 'Rust project is not present yet; checks will activate when Cargo.toml is added.'

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            prototype/package-lock.json
      - name: Check SvelteKit frontend
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        run: |
          npm ci
          npm run format:check --if-present
          npm run lint --if-present
          npm run check
          npm test --if-present
          npm run build
      - name: Check static prototype
        if: ${{ hashFiles('prototype/package.json') != '' }}
        working-directory: prototype
        run: |
          npm ci
          npm run check:all
      - name: Note absent frontend projects
        if: ${{ hashFiles('frontend/package.json', 'prototype/package.json') == '' }}
        run: echo 'Frontend project is not present yet.'

  sqlite-migrations:
    name: SQLite migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply skeleton migrations to an empty database
        run: |
          set -euo pipefail
          database="${RUNNER_TEMP}/bblbb.sqlite"
          for migration in migrations/sqlite/*.sql; do
            sqlite3 -bail "$database" < "$migration"
          done
          test -z "$(sqlite3 "$database" 'PRAGMA foreign_key_check;')"
          sqlite3 "$database" "SELECT 1 FROM users LIMIT 0; SELECT 1 FROM user_sessions LIMIT 0;"

  mysql-family-migrations:
    name: ${{ matrix.name }} migrations
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 8
            image: mysql:8.0
            directory: mysql
          - name: MariaDB 10.11
            image: mariadb:10.11
            directory: mariadb
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bblbb
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: bblbb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Install database client
        run: |
          sudo apt-get update
          sudo apt-get install --yes default-mysql-client
      - name: Apply skeleton migrations to an empty database
        env:
          MYSQL_PWD: root
          MIGRATION_DIRECTORY: ${{ matrix.directory }}
        run: |
          set -euo pipefail
          for migration in "migrations/${MIGRATION_DIRECTORY}"/*.sql; do
            mysql --protocol=TCP --host=127.0.0.1 --port=3306 --user=root bblbb < "$migration"
          done
          mysql --protocol=TCP --host=127.0.0.1 --port=3306 --user=root bblbb \
            --execute='SELECT 1 FROM users LIMIT 0; SELECT 1 FROM user_sessions LIMIT 0;'

      # 上一步用 mysql CLI 直灌 SQL（不写 schema_migrations 状态表）；跨库测试
      # 二进制改用应用内置 run_migrations（按状态表判断 pending）再建 schema，
      # 残留表会触发 1050 Table already exists。重置为空库让测试自建 schema；
      # 首个测试二进制应用后写入状态表，后续二进制幂等跳过。
      - name: Reset schema for cross-database test binaries
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          mysql --protocol=TCP --host=127.0.0.1 --port=3306 --user=root \
            --execute='DROP SCHEMA bblbb; CREATE SCHEMA bblbb;'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # AGENTS.md §3.4：跨库测试编译缓存
      - name: Install sccache
        run: |
          sudo apt-get update
          sudo apt-get install -y sccache
      - name: Cache sccache build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: sccache-${{ runner.os }}-
      - name: Cache cargo registry and git deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-deps-${{ runner.os }}-
      # AGENTS.md §3.4：CI target-dir 缓存（配合 workflow 级 CARGO_TARGET_DIR 覆盖）
      - name: Cache cargo target dir
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-${{ runner.os }}-
      - name: Cross-database semantics (row locks + session/auth behavior)
        env:
          BBLBB_TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306/bblbb
          RUSTC_WRAPPER: sccache
          SCCACHE_IDLE_TIMEOUT: "0"
        working-directory: backend
        run: |
          cargo test --test transaction_concurrency -- --ignored
          cargo test --test session_crossdb -- --ignored
          cargo test --test auth_crossdb -- --ignored
          cargo test --test conversations_crossdb -- --ignored
          cargo test --test schema_fixture -- --ignored
          cargo test --test search_store -- --ignored
          cargo test --test search_fixture -- --ignored
