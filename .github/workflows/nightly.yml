# BBLBB — Nightly 长测试（M16-HARNESS-09：PR 快速检查与发布长测试分离）
#
# 触发：每日 UTC 02:00（cron 按仓库默认分支）+ workflow_dispatch 手动。
# 内容：PR 全量 + Playwright desktop/mobile + axe + 契约矩阵 + 故障注入回归。
# 失败不阻断合并，但当日必须有人认领（按 docs/CI-LAYERS.md 最小复现命令）。

name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# AGENTS.md §3.1：backend/.cargo/config.toml 把 target-dir 固定为开发机路径
# /data/cargo-target/bblbb（保护根分区）；CI runner 无权创建 /data。
# Cargo 环境变量优先于 config 文件，CI 统一覆盖为工作区可写路径，
# 本地开发行为不受影响（见 ci.yml 同名说明，AGENTS.md §3.4）。
env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  pr-suite:
    name: PR suite (reuse ci.yml)
    uses: ./.github/workflows/ci.yml

  playwright:
    name: Playwright desktop + mobile + axe
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      # AGENTS.md §3.4：构建缓存
      - name: Install sccache
        run: |
          sudo apt-get update
          sudo apt-get install -y sccache
      - name: Cache sccache build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-${{ runner.os }}-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-e2e-
            sccache-${{ runner.os }}-
      - name: Cache cargo registry and git deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-deps-${{ runner.os }}-
      - name: Cache cargo target dir
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-target-${{ runner.os }}-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-e2e-
            cargo-target-${{ runner.os }}-
      - name: Build backend for E2E
        working-directory: backend
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_IDLE_TIMEOUT: "0"
        run: cargo build --bin bblbb-backend --bin bblbb-migrate
      - name: Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install dependencies and browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E + axe (desktop + mobile, real backend + personas)
        working-directory: frontend
        env:
          E2E_BACKEND_BIN: ${{ github.workspace }}/target/debug/bblbb-backend
        run: npm run test:e2e
      - name: Report axe results
        run: |
          test -f frontend/tests/a11y/axe-report.json
          ruby -rjson -e 'r=JSON.parse(File.read("frontend/tests/a11y/axe-report.json")); c=r.is_a?(Array) ? r : r["results"]; puts "axe artifacts present: #{c ? c.length : "n/a"} scans"'

  contract-matrices:
    name: Contract matrices (error codes / state machine / client compat)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run contract matrix scripts
        run: |
          ruby scripts/check-error-codes.rb
          ruby scripts/check-code-fixtures.rb
          ruby scripts/check-state-machine-matrix.rb
          ruby scripts/check-client-compat.rb
          ruby scripts/check-openapi.rb

  fault-injection:
    name: Storage faults + economy step-injection regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # AGENTS.md §3.4：故障注入测试编译缓存
      - name: Install sccache
        run: |
          sudo apt-get update
          sudo apt-get install -y sccache
      - name: Cache sccache build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: sccache-${{ runner.os }}-
      - name: Cache cargo registry and git deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-deps-${{ runner.os }}-
      # AGENTS.md §3.4：CI target-dir 缓存（配合 workflow 级 CARGO_TARGET_DIR 覆盖）
      - name: Cache cargo target dir
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-target-${{ runner.os }}-
      - name: Run M16 fault/step-injection tests
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_IDLE_TIMEOUT: "0"
          # 与 ci.yml 一致：sccache 默认 10GiB 上限在 14GB runner 上与恢复的
          # target 缓存叠加易触发 No space left on device。
          SCCACHE_CACHE_SIZE: 4GiB
        working-directory: backend
        run: |
          cargo test --test storage_adapter --all-features
          cargo test --test faults --all-features
          cargo test --test economy_step_injection --all-features
