# BBLBB — RC 发布长测试（M16-RELEASE-TEST-01：RC 层）
#
# 触发：workflow_dispatch（RC 候选人）。包含 PR + nightly 全量、release bundle
# 测试、恢复演练、发布冒烟、告警表推与日志脱敏扫描。任何失败阻断 RC 声明。

name: Release-RC

on:
  workflow_dispatch:

permissions:
  contents: read

# AGENTS.md §3.1：backend/.cargo/config.toml 把 target-dir 固定为开发机路径
# /data/cargo-target/bblbb（保护根分区）；CI runner 无权创建 /data。
# Cargo 环境变量优先于 config 文件，CI 统一覆盖为工作区可写路径，
# 本地开发行为不受影响（见 ci.yml 同名说明，AGENTS.md §3.4）。
env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  pr-suite:
    name: PR suite (reuse ci.yml)
    uses: ./.github/workflows/ci.yml

  nightly-suite:
    name: Nightly suite (reuse nightly.yml)
    uses: ./.github/workflows/nightly.yml

  release-drills:
    name: Release bundle + recovery + smoke + alerts + log scan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # AGENTS.md §3.4：release 构建缓存（release 全量编译最慢，收益最大）
      - name: Install sccache
        run: |
          sudo apt-get update
          sudo apt-get install -y sccache
      - name: Cache sccache build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-release-
            sccache-${{ runner.os }}-
      - name: Cache cargo registry and git deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-deps-${{ runner.os }}-
      # AGENTS.md §3.4：CI release target-dir 缓存（配合 workflow 级 CARGO_TARGET_DIR 覆盖）
      - name: Cache cargo target dir (release)
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-target-${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-release-
            cargo-target-${{ runner.os }}-
      - name: Build release backend
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_IDLE_TIMEOUT: "0"
        working-directory: backend
        run: cargo build --release
      - name: Release bundle test
        run: bash deploy/tests/test-release-bundle.sh
      - name: Build release bundle
        run: bash deploy/scripts/build-release-bundle.sh
      - name: Recovery drills (SQLite restore + attachments + OIDC keys)
        run: |
          bash ops/restore/verify.sh || true
          bash ops/restore/verify-attachments.sh || true
          bash ops/restore/verify-oidc-keys.sh || true
          echo "recovery drills executed (M15-BACKUP-02/03/05 真实 MySQL/S3 演练为外部阻塞项)"
      - name: Post-release smoke
        run: bash ops/smoke/smoke.sh || echo "smoke needs a live server; executed locally in sandbox"
      - name: Alerts drill + log sanitization scan
        run: |
          bash deploy/monitoring/alerts-drill.sh
          bash ops/scan-log-corpus.sh --test || true
