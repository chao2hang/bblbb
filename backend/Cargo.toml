[package]
name = "bblbb-backend"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
async-trait = "0.1"
config = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "signal", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit", "trace", "timeout", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v7", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
hex = "0.4"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
time = "0.3"
unicode-normalization = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "mysql", "chrono", "uuid"] }
pulldown-cmark = { version = "0.10", features = ["html"] }
ammonia = "4.1.4"
url = "2.5.8"

[dev-dependencies]
tower = "0.5"
http-body-util = "0.1"
tokio = { version = "1", features = ["test-util", "sync"] }

# M05-SCHEMA 测试（嵌套目录不参与自动发现，需显式注册）
[[test]]
name = "moderation_schema"
path = "tests/moderation/schema.rs"

[[test]]
name = "notifications_schema"
path = "tests/notifications/schema.rs"

# M05-RISK 测试（嵌套目录不参与自动发现，需显式注册）
[[test]]
name = "moderation_risk"
path = "tests/moderation/risk.rs"

# M05-CASES 测试（嵌套目录不参与自动发现，需显式注册）
[[test]]
name = "moderation_cases"
path = "tests/moderation/cases.rs"
