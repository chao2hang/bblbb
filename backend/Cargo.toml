[package]
name = "bblbb-backend"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
config = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v7", "fast-rng"] }

[dev-dependencies]
tower = "0.5"
http-body-util = "0.1"
