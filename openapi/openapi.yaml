components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-bblbb_session
      description: Browser session cookie. State-changing requests also require X-CSRF-Token.
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
  headers:
    RequestId:
      description: UUID v7 request correlation ID.
      schema:
        type: string
        format: uuid
    SessionCookie:
      description: Secure, HttpOnly, SameSite browser session cookie.
      schema:
        type: string
  parameters:
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    After:
      name: after
      in: query
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 120
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
  responses:
    AuthenticationRequired:
      description: Authentication is required
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    CsrfFailed:
      description: CSRF validation failed
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    NotFound:
      description: Resource is missing or intentionally hidden
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    VersionConflict:
      description: Optimistic concurrency conflict
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    IdempotencyConflict:
      description: Idempotency key was reused with another request
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    ValidationError:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    ActivityAlreadyClaimed:
      description: Daily automatic check-in already exists
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    NoContent:
      description: Operation completed with no response body
      headers:
        Cache-Control:
          description: private, no-store
          schema:
            type: string
            example: private, no-store
    Accepted:
      description: Task accepted
      headers:
        Cache-Control:
          description: private, no-store
          schema:
            type: string
            example: private, no-store
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/TaskAccepted"
    Conflict:
      description: Business state conflict
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    TooLarge:
      description: Payload or attachment is too large
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    RateLimited:
      description: Request rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    ServiceUnavailable:
      description: A required dependency is temporarily unavailable
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    GenericSuccess:
      description: Successful operation
      headers:
        Cache-Control:
          description: private, no-store
          schema:
            type: string
            example: private, no-store
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/GenericSuccess"
    ProblemResponse:
      description: Request failed
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
  schemas:
    GenericRequest:
      type: object
      additionalProperties: true
    DeviceSession:
      type: object
      additionalProperties: false
      required:
      - id
      - user_agent
      - created_at
      - last_seen_at
      - absolute_expires_at
      - version
      properties:
        id:
          type: string
        user_agent:
          type:
          - string
          - 'null'
        created_at:
          type: integer
          format: int64
        last_seen_at:
          type: integer
          format: int64
        absolute_expires_at:
          type: integer
          format: int64
        version:
          type: integer
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - email
      - password
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
    AttachmentCreate:
      type: object
      additionalProperties: false
      required:
      - filename
      - size
      - declared_media_type
      properties:
        filename:
          type: string
        size:
          type: integer
          format: int64
        declared_media_type:
          type: string
        target_type:
          type:
          - string
          - 'null'
        target_id:
          type:
          - string
          - 'null'
          format: uuid
    PublicUser:
      type: object
      required:
      - username
      - display_name
      - level
      properties:
        username:
          type: string
        display_name:
          type: string
        level:
          type: integer
        bio:
          type: string
    GenericSuccess:
      type: object
      additionalProperties: true
    Health:
      type: object
      required:
      - status
      - version
      properties:
        status:
          type: string
          enum:
          - ok
        version:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - identifier
      - password
      properties:
        identifier:
          type: string
          maxLength: 320
          description: 用户名或邮箱（不区分大小写）
        password:
          type: string
          minLength: 8
          maxLength: 256
          writeOnly: true
    LoginMfaChallenge:
      type: object
      additionalProperties: false
      required:
      - mfa_required
      - challenge_token
      properties:
        mfa_required:
          type: boolean
          const: true
          description: 账号启用 TOTP：密码已验证，需第二步 /login/mfa 完成登录
        challenge_token:
          type: string
          writeOnly: true
          description: 一次性 MFA login challenge（5 分钟过期，只出现一次）
    LoginMfaRequest:
      type: object
      additionalProperties: false
      required:
      - challenge_token
      properties:
        challenge_token:
          type: string
          description: 第一步 /login 返回的一次性 challenge
        totp_code:
          type: string
          pattern: "^[0-9]{6}$"
          description: 6 位 TOTP code（totp_code 与 recovery_code 二选一）
        recovery_code:
          type: string
          pattern: "^[A-Z2-7]{16}$"
          description: 恢复码（totp_code 与 recovery_code 二选一）
    LoginResult:
      oneOf:
      - "$ref": "#/components/schemas/Me"
      - "$ref": "#/components/schemas/LoginMfaChallenge"
      description: 未启用 TOTP → Me（含会话 Cookie）；启用 TOTP → 第一步仅返回 MFA challenge
    ProfilePatch:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        bio:
          type: string
          maxLength: 2000
        timezone:
          type: string
          maxLength: 64
        theme:
          type: string
          maxLength: 64
    PostCreate:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - markdown
      - board_id
      - visibility_level
      - access_policy
      - client_request_id
      properties:
        type:
          type: string
          enum:
          - article
          - discussion
        title:
          type: string
          minLength: 1
          maxLength: 240
        markdown:
          type: string
          minLength: 1
          maxLength: 1000000
        board_id:
          type: string
          format: uuid
        visibility_level:
          type: integer
          minimum: 1
          description: Must not exceed the author's current level.
        access_policy:
          type: string
          enum:
          - public
          - logged_in
          - after_reply
          - level
          - paid
        scheduled_at:
          type:
          - string
          - 'null'
          format: date-time
        client_request_id:
          type: string
