---
openapi: 3.1.0
info:
  title: BBLBB API
  version: 1.0.0
  description: |
    BBLBB 稳定业务 API。字段、错误、权限和安全语义以本文件及其引用的冻结文档为准。
    生产实现必须保持 SQLite、MySQL 8 和 MariaDB 10.11 的契约一致性。
  license:
    name: Proprietary
servers:
- url: https://{host}
  variables:
    host:
      default: forum.example.com
security: []
tags:
- name: AI
- name: Activity
- name: Admin
- name: Attachments
- name: Auth
- name: Boards
- name: Comments
- name: Download Billing
- name: Drafts
- name: Feeds
- name: Health
- name: Marketplace
- name: Moderation
- name: Notifications
- name: OAuth
- name: OAuth Clients
- name: Posts
- name: Revisions
- name: Roles
- name: Search
- name: Shop
- name: Tags
- name: Themes
- name: Users
- name: Video
paths:
  "/healthz":
    get:
      tags:
      - Health
      operationId: getHealth
      summary: Liveness check
      security: &1 []
      x-permission: public
      x-csrf: false
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Health"
        '429':
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/auth/login":
    post:
      tags:
      - Auth
      operationId: login
      security: *1
      summary: Create a browser session
      x-permission: public
      x-csrf: true
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        '200':
          description: 登录结果（未启用 TOTP → Me；启用 TOTP → MFA challenge）
          headers:
            Cache-Control:
              description: private, no-store
              schema:
                type: string
                example: private, no-store
            Set-Cookie:
              "$ref": "#/components/headers/SessionCookie"
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginResult"
        '401':
          "$ref": "#/components/responses/AuthenticationRequired"
        '422':
          "$ref": "#/components/responses/ValidationError"
        '429':
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/auth/login/mfa":
    post:
      tags:
      - Auth
      operationId: loginMfa
      security: *1
      summary: Complete two-step MFA login (TOTP or recovery code)
      x-permission: public
      x-csrf: true
      x-csrf-context: preauth
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginMfaRequest"
      responses:
        '200':
          description: Authenticated user projection
          headers:
            Cache-Control:
              description: private, no-store
              schema:
                type: string
                example: private, no-store
            Set-Cookie:
              "$ref": "#/components/headers/SessionCookie"
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Me"
        '401':
          "$ref": "#/components/responses/AuthenticationRequired"
        '422':
          "$ref": "#/components/responses/ValidationError"
        '429':
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/auth/session":
    delete:
      tags:
      - Auth
      operationId: logout
      summary: Revoke the current browser session
      security:
      - sessionCookie: []
      x-permission: session.revoke_own
      x-csrf: true
      responses:
        '204':
          headers:
            Cache-Control:
              description: private, no-store
              schema:
                type: string
                example: private, no-store
          description: Session revoked
        '403':
          "$ref": "#/components/responses/CsrfFailed"
        '401':
          "$ref": "#/components/responses/AuthenticationRequired"
        '429':
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/auth/sessions":
    get:
      tags:
      - Auth
      operationId: listSessions
      summary: List the current user's active device sessions
      security:
      - sessionCookie: []
      x-permission: session.read_own
      x-csrf: false
      responses:
        '200':
          description: Active device sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/DeviceSession"
        '401':
          "$ref": "#/components/responses/AuthenticationRequired"
        '429':
          "$ref": "#/components/responses/RateLimited"
    delete:
      tags:
      - Auth
      operationId: logoutAll
      summary: Revoke all of the current user's sessions
      security:
      - sessionCookie: []
      x-permission: session.revoke_own
      x-csrf: true
      responses:
        '204':
          headers:
            Cache-Control:
              description: private, no-store
              schema:
                type: string
                example: private, no-store
          description: All sessions revoked
        '401':
          "$ref": "#/components/responses/AuthenticationRequired"
        '403':
          "$ref": "#/components/responses/CsrfFailed"
        '429':
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/auth/sessions/{id}":
    delete:
      tags:
      - Auth
      operationId: revokeSession
      summary: Revoke one of the current user's device sessions
      security:
      - sessionCookie: []
      x-permission: session.revoke_own
      x-csrf: true
      parameters:
      - "$ref": "#/components/parameters/Id"
      responses:
        '200':
          "$ref": "#/components/responses/GenericSuccess"
        '401':
          "$ref": "#/components/responses/AuthenticationRequired"
        '403':
          "$ref": "#/components/responses/CsrfFailed"
        '404':
          "$ref": "#/components/responses/ProblemResponse"
        '429':
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/me":
    get:
      tags:
      - Users
      operationId: getMe
      summary: Get the current user
      security:
      - sessionCookie: []
      x-permission: user.read_own
      x-csrf: false
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Me"
        '401':
          "$ref": "#/components/responses/AuthenticationRequired"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '429':
          "$ref": "#/components/responses/RateLimited"
    patch:
      tags:
      - Users
      operationId: updateMe
      summary: Update the current profile
      security:
      - sessionCookie: []
      x-permission: user.edit_own
      x-csrf: true
      parameters:
      - "$ref": "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProfilePatch"
      responses:
        '200':
          headers:
            Cache-Control:
              description: private, no-store
              schema:
                type: string
                example: private, no-store
          description: Updated profile
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Me"
        '409':
          "$ref": "#/components/responses/VersionConflict"
        '422':
          "$ref": "#/components/responses/ValidationError"
        '401':
          "$ref": "#/components/responses/AuthenticationRequired"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '429':
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/boards":
    get:
      tags:
      - Boards
      operationId: listBoards
      security: *1
      summary: List visible boards
      x-permission: public
      x-csrf: false
      parameters:
      - "$ref": "#/components/parameters/Limit"
      - "$ref": "#/components/parameters/After"
      responses:
        '200':
          description: Cursor-paginated boards
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BoardPage"
        '429':
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/posts":
    get:
      tags:
      - Posts
      operationId: listPosts
      security: *1
      summary: List posts visible to the requester
      x-permission: public
      x-csrf: false
      parameters:
      - name: board_id
        in: query
        schema:
          type: string
          format: uuid
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - latest
          - popular
        default: latest
      - "$ref": "#/components/parameters/Limit"
      - "$ref": "#/components/parameters/After"
      responses:
        '200':
          description: Visible posts; restricted bodies are omitted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PostPage"
        '429':
          "$ref": "#/components/responses/RateLimited"
    post:
      tags:
      - Posts
      operationId: createPost
      summary: Create an article or discussion
      security:
      - sessionCookie: []
      x-permission: post.create
      x-csrf: true
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PostCreate"
      responses:
        '201':
          headers:
            Cache-Control:
              description: private, no-store
              schema:
                type: string
                example: private, no-store
          description: Created post
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Post"
        '401':
          "$ref": "#/components/responses/AuthenticationRequired"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/IdempotencyConflict"
        '422':
          description: Validation or author-level constraint
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '429':
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/posts/{postId}":
    parameters:
    - "$ref": "#/components/parameters/PostId"
    get:
      tags:
      - Posts
      operationId: getPost
      security: &2
      - sessionCookie: []
      - bearerToken: []
      summary: Get a post with the requester's visibility projection
      x-permission: post.read
      x-csrf: false
      responses:
        '200':
          description: Post projection
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Post"
        '404':
          "$ref": "#/components/responses/NotFound"
        '401':
          "$ref": "#/components/responses/AuthenticationRequired"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '429':
          "$ref": "#/components/responses/RateLimited"
      parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags:
      - Posts
      operationId: updatePost
      summary: Update an owned post
      security:
      - sessionCookie: []
      x-permission: post.edit_own
      x-csrf: true
      parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - "$ref": "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PostPatch"
      responses:
        '200':
          headers:
            Cache-Control:
              description: private, no-store
              schema:
                type: string
                example: private, no-store
          description: Updated post
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Post"
        '409':
          "$ref": "#/components/responses/VersionConflict"
        '404':
          "$ref": "#/components/responses/NotFound"
        '401':
          "$ref": "#/components/responses/AuthenticationRequired"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '429':
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/posts/{postId}/comments":
    parameters:
    - "$ref": "#/components/parameters/PostId"
    get:
      tags:
      - Comments
      operationId: listComments
      security: *2
      summary: List visible comments
      x-permission: comment.read
      x-csrf: false
      parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - "$ref": "#/components/parameters/Limit"
      - "$ref": "#/components/parameters/After"
      responses:
        '200':
          description: Cursor-paginated comments
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommentPage"
        '401':
          "$ref": "#/components/responses/AuthenticationRequired"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '429':
          "$ref": "#/components/responses/RateLimited"
    post:
      tags:
      - Comments
      operationId: createComment
      summary: Reply to a post
      security:
      - sessionCookie: []
      x-permission: comment.create
      x-csrf: true
      parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CommentCreate"
      responses:
        '201':
          headers:
            Cache-Control:
              description: private, no-store
              schema:
                type: string
                example: private, no-store
          description: Created comment
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Comment"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          "$ref": "#/components/responses/ValidationError"
        '401':
          "$ref": "#/components/responses/AuthenticationRequired"
        '429':
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/activity/visit":
    post:
      tags:
      - Activity
      operationId: recordAuthenticatedVisit
      summary: Record the first valid business-page visit for automatic check-in
      security:
      - sessionCookie: []
      x-permission: activity.claim_own
      x-csrf: true
      responses:
        '200':
          headers:
            Cache-Control:
              description: private, no-store
              schema:
                type: string
                example: private, no-store
          description: Existing or newly created activity summary
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ActivityVisitResult"
        '401':
          "$ref": "#/components/responses/AuthenticationRequired"
        '409':
          "$ref": "#/components/responses/ActivityAlreadyClaimed"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '429':
          "$ref": "#/components/responses/RateLimited"
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
  "/api/v1/auth/csrf":
    get:
      tags:
      - Auth
      operationId: getCsrfToken
      security:
      - sessionCookie: []
      x-permission: public
      x-csrf: false
      responses:
        '200':
          description: CSRF token（已认证为 Session 绑定，未认证为匿名预认证 token）
          headers:
            Set-Cookie:
              description: 未认证时签发 `__Host-bblbb_csrf` 预认证 cookie（匿名预认证 CSRF 状态，M02-SESSION-08）；已认证时不设置。
              schema:
                type: string
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CsrfToken"
        '401':
          "$ref": "#/components/responses/AuthenticationRequired"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '429':
          "$ref": "#/components/responses/RateLimited"
      summary: getCsrfToken
  "/api/v1/auth/register":
    post:
      tags:
      - Auth
      operationId: register
      security: *1
      x-permission: public
      x-csrf: true
      x-csrf-context: preauth
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegisterRequest"
      responses:
        '201':
          "$ref": "#/components/responses/GenericSuccess"
        '422':
          "$ref": "#/components/responses/ValidationError"
        '429':
          "$ref": "#/components/responses/RateLimited"
      summary: register
  "/api/v1/auth/verify-email":
    post:
      tags:
      - Auth
      operationId: verifyEmail
      security: *1
      x-permission: public
      x-csrf: true
      x-csrf-context: preauth
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TokenRequest"
      responses:
        '200':
          "$ref": "#/components/responses/GenericSuccess"
        '422':
          "$ref": "#/components/responses/ValidationError"
        '429':
          "$ref": "#/components/responses/RateLimited"
      summary: verifyEmail
  "/api/v1/auth/resend-verification":
    post:
      tags:
      - Auth
      operationId: resendVerification
      security: *1
      x-permission: public
      x-csrf: true
      x-csrf-context: preauth
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PasswordResetRequest"
      responses:
        '202':
          "$ref": "#/components/responses/GenericSuccess"
        '422':
          "$ref": "#/components/responses/ValidationError"
        '429':
          "$ref": "#/components/responses/RateLimited"
      summary: resendVerification
  "/api/v1/auth/password-reset":
    post:
      tags:
      - Auth
      operationId: requestPasswordReset
      security: *1
      x-permission: public
      x-csrf: true
      x-csrf-context: preauth
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PasswordResetRequest"
      responses:
        '202':
          "$ref": "#/components/responses/GenericSuccess"
        '422':
          "$ref": "#/components/responses/ValidationError"
        '429':
          "$ref": "#/components/responses/RateLimited"
      summary: requestPasswordReset
  "/api/v1/auth/password-reset/confirm":
    post:
      tags:
      - Auth
      operationId: confirmPasswordReset
      security: *1
      x-permission: public
      x-csrf: true
      x-csrf-context: preauth
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PasswordResetConfirm"
      responses:
        '200':
          "$ref": "#/components/responses/GenericSuccess"
        '422':
          "$ref": "#/components/responses/ValidationError"
        '429':
          "$ref": "#/components/responses/RateLimited"
      summary: confirmPasswordReset
  "/api/v1/users/{username}":
    get:
      tags:
      - Users
      operationId: getPublicUser
      security: *2
      x-permission: user.read_public
      x-csrf: false
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Public user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PublicUser"
        '404':
          "$ref": "#/components/responses/NotFound"
        '401':
          "$ref": "#/components/responses/AuthenticationRequired"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '429':
          "$ref": "#/components/responses/RateLimited"
      summary: getPublicUser
  "/api/v1/boards/{slug}":
    get:
      tags:
      - Boards
      operationId: getBoard
      security: *2
      x-permission: board.read
      x-csrf: false
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Board
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Board"
        '404':
          "$ref": "#/components/responses/NotFound"
        '401':
          "$ref": "#/components/responses/AuthenticationRequired"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '429':
          "$ref": "#/components/responses/RateLimited"
      summary: getBoard
  "/api/v1/boards/{slug}/posts":
    get:
      tags:
      - Posts
      operationId: listBoardPosts
      security: *2
      x-permission: post.read
      x-csrf: false
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - "$ref": "#/components/parameters/Limit"
      - "$ref": "#/components/parameters/After"
      responses:
        '200':
          description: Posts
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PostPage"
        '401':
          "$ref": "#/components/responses/AuthenticationRequired"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '429':
          "$ref": "#/components/responses/RateLimited"
      summary: listBoardPosts
  "/api/v1/tags":
    get:
      tags:
      - Boards
      operationId: listTags
      security: *1
      x-permission: public
      x-csrf: false
      responses:
        '200':
          "$ref": "#/components/responses/GenericSuccess"
        '429':
          "$ref": "#/components/responses/RateLimited"
      summary: listTags
  "/api/v1/attachments":
    post:
      tags:
      - Attachments
      operationId: createAttachment
      security:
      - sessionCookie: []
      x-permission: attachment.upload
      x-csrf: true
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AttachmentCreate"
      responses:
        '201':
          "$ref": "#/components/responses/GenericSuccess"
        '413':
          "$ref": "#/components/responses/ProblemResponse"
        '409':
          "$ref": "#/components/responses/ProblemResponse"
        '401':
          "$ref": "#/components/responses/AuthenticationRequired"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '429':
          "$ref": "#/components/responses/RateLimited"
      summary: createAttachment
  "/api/v1/attachments/{id}":
    get:
      tags:
      - Attachments
      operationId: get_attachments_id_
      security: *2
      x-permission: authenticated
      x-csrf: false
      responses:
        '200':
          "$ref": "#/components/responses/GenericSuccess"
        '204':
          description: No content
        '400':
          "$ref": "#/components/responses/ProblemResponse"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '401':
          "$ref": "#/components/responses/AuthenticationRequired"
        '429':
          "$ref": "#/components/responses/RateLimited"
      summary: get api v1 attachments id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags:
      - Attachments
      operationId: delete_attachments_id_
      security:
      - sessionCookie: []
      x-permission: authenticated
      x-csrf: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GenericRequest"
      responses:
        '200':
          "$ref": "#/components/responses/GenericSuccess"
        '204':
