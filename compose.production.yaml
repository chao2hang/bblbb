name: bblbb
services:
  migrate:
    image: ghcr.io/chao2hang/bblbb:main
    command: ["migrate"]
    env_file: .env
    volumes:
      - ./uploads:/app/uploads
    networks: [default, shared-net]
    restart: "no"
  backend:
    image: ghcr.io/chao2hang/bblbb:main
    command: ["backend"]
    env_file: .env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:8080:8080"
    networks: [default, shared-net]
    restart: unless-stopped
  worker:
    image: ghcr.io/chao2hang/bblbb:main
    command: ["worker"]
    env_file: .env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [default, shared-net]
    restart: unless-stopped
  frontend:
    image: ghcr.io/chao2hang/bblbb:main
    command: ["frontend"]
    environment:
      INTERNAL_API_ORIGIN: http://backend:8080
      ORIGIN: ${BBLBB__PUBLIC_ORIGIN:?set BBLBB__PUBLIC_ORIGIN in .env}
      PORT: "3000"
      HOST: 0.0.0.0
      BODY_SIZE_LIMIT: 3M
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:3000:3000"
    networks: [default]
    restart: unless-stopped
networks:
  shared-net:
    external: true
