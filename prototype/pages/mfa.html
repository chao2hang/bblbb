<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="BBLBB 社区原型 · 两步验证">
<meta name="theme-color" content="#F5F3EE" id="theme-color"><script>try{var p=localStorage.getItem("bblbb-theme")||"system";var t=p==="dark"||(p!=="light"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";document.documentElement.dataset.theme=t;document.documentElement.dataset.themePreference=p;document.documentElement.style.colorScheme=t;document.querySelector("#theme-color").setAttribute("content",t==="dark"?"#0D0D0D":"#F5F3EE")}catch(e){document.documentElement.dataset.theme="light"}</script><title>两步验证 · BBLBB 社区</title>
  <link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/prototype-app.css">
<link rel="stylesheet" href="../assets/prototype-workflows.css">
<link rel="stylesheet" href="../assets/chinese-elegance.css">
</head>
<body data-standalone="1">
<!-- 共享骨架（SVG sprite / 顶栏 / 底部导航 / Toast）由 assets/page-chrome.js 注入 -->
<script src="../assets/page-chrome.js"></script>
<main class="layout" id="main" tabindex="-1">
<!-- 本文件既是独立页面（浏览器可直接打开预览），也是 SPA 的模板来源（prototype-app.js 提取 section.page 的内容挂载） -->
<section class="page app-page app-route-mfa" id="page-mfa">
<div class="app-route-head"><div class="app-route-head__copy"><span class="app-kicker">ACCOUNT / SECURITY</span><h1 tabindex="-1">两步验证</h1><p>TOTP、恢复码与 step-up 操作</p></div></div><section class="app-card"><header class="app-card__head"><h2>启用 TOTP</h2></header><div class="app-card__body"><div class="app-notice">扫描二维码后输入 6 位验证码。二维码和恢复码只在服务端生成，原型不保存真实 Secret。</div><label class="app-field-label">验证码</label><input class="app-field" data-mfa-code="" inputmode="numeric" maxlength="6" placeholder="000000"><div class="app-form-actions"><button type="button" class="btn ghost" data-go-settings="security" aria-label="返回账号安全设置">取消</button><button type="button" class="btn primary" data-enable-mfa="">确认启用</button></div></div></section><section class="app-card"><header class="app-card__head"><h2>恢复码</h2></header><div class="app-card__body"><p class="app-muted">启用后可生成一次性恢复码；生成前需要重新认证。</p><button type="button" class="btn ghost" data-recovery-codes="">重新生成恢复码</button></div></section>
</section>
</main>
</body>
</html>
