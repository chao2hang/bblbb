<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="BBLBB 社区原型 · 重置密码">
<meta name="theme-color" content="#F5F3EE" id="theme-color"><script>try{var p=localStorage.getItem("bblbb-theme")||"system";var t=p==="dark"||(p!=="light"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";document.documentElement.dataset.theme=t;document.documentElement.dataset.themePreference=p;document.documentElement.style.colorScheme=t;document.querySelector("#theme-color").setAttribute("content",t==="dark"?"#0D0D0D":"#F5F3EE")}catch(e){document.documentElement.dataset.theme="light"}</script><title>重置密码 · BBLBB 社区</title>
  <link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/prototype-app.css">
<link rel="stylesheet" href="../assets/prototype-workflows.css">
<link rel="stylesheet" href="../assets/chinese-elegance.css">
</head>
<body data-standalone="1">
<!-- 共享骨架（SVG sprite / 顶栏 / 底部导航 / Toast）由 assets/page-chrome.js 注入 -->
<script src="../assets/page-chrome.js"></script>
<main class="layout" id="main" tabindex="-1">
<!-- 本文件既是独立页面（浏览器可直接打开预览），也是 SPA 的模板来源（prototype-app.js 提取 section.page 的内容挂载） -->
<section class="page app-page app-route-forgot-password" id="page-forgot-password">
<section class="login-shell"><div class="login-card"><p class="login-eyebrow">ACCOUNT RECOVERY</p><h1 tabindex="-1">重置密码</h1><p>输入注册邮箱，我们将发送重置链接。</p><form data-forgot=""><label class="login-field"><span>邮箱</span><input data-forgot-email="" aria-label="邮箱" type="email" placeholder="alice@example.com"><small data-forgot-error=""></small></label><button class="btn primary login-submit">发送重置邮件</button></form><p class="login-signup"><a href="#login">想起密码了？返回登录</a></p></div></section>
</section>
</main>
</body>
</html>
