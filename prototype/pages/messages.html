<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="BBLBB 社区原型 · 消息">
<meta name="theme-color" content="#F5F3EE" id="theme-color"><script>try{var p=localStorage.getItem("bblbb-theme")||"system";var t=p==="dark"||(p!=="light"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";document.documentElement.dataset.theme=t;document.documentElement.dataset.themePreference=p;document.documentElement.style.colorScheme=t;document.querySelector("#theme-color").setAttribute("content",t==="dark"?"#0D0D0D":"#F5F3EE")}catch(e){document.documentElement.dataset.theme="light"}</script><title>消息 · BBLBB 社区</title>

<body data-standalone="1">
<!-- 共享骨架（SVG sprite / 顶栏 / 底部导航 / Toast）由 assets/page-chrome.js 注入 -->
<script src="../assets/page-chrome.js"></script>
<main class="layout" id="main" tabindex="-1">
<!-- 本文件既是独立页面（浏览器可直接打开预览），也是 SPA 的模板来源（prototype-app.js 提取 section.page 的内容挂载） -->
<section class="page app-page app-route-messages" id="page-messages">
<div class="app-page-head"><div class="app-page-head__copy"><span class="app-kicker">INBOX / MESSAGES</span><h1 tabindex="-1">消息</h1><p>私信会话、发送状态与失败重试</p></div><div class="app-page-head__actions"><button type="button" class="btn ghost" data-message-fail="">模拟发送失败</button></div></div><div class="app-message-layout"><aside class="app-card app-conversations"><div class="app-card__body"><button class="app-conversation is-active" data-conversation="Lin"><span class="message-avatar-wrap"><span class="avatar cyan profile-hover-trigger" style="width:42px;height:42px;flex-basis:42px" data-profile-name="L" tabindex="0" role="button" aria-label="查看 L 的用户信息">L</span><i class="message-online is-online"></i></span><span class="conversation-copy"><b>Lin <small class="conversation-level">LV.3</small></b><small class="conversation-username">@linlv3 · 活跃成员</small><small class="conversation-preview">结论会在下次更新公告里公布。</small></span><em>12 分钟前</em></button><button class="app-conversation " data-conversation="Nina"><span class="message-avatar-wrap"><span class="avatar cyan profile-hover-trigger" style="width:42px;height:42px;flex-basis:42px" data-profile-name="N" tabindex="0" role="button" aria-label="查看 N 的用户信息">N</span><i class="message-online is-online"></i></span><span class="conversation-copy"><b>Nina <small class="conversation-level">LV.3</small></b><small class="conversation-username">@nina · 性能与可观测性</small><small class="conversation-preview">好的，性能那篇我明天发出来一起讨论。</small></span><em>1 小时前</em></button><button class="app-conversation " data-conversation="Mark"><span class="message-avatar-wrap"><span class="avatar cyan profile-hover-trigger" style="width:42px;height:42px;flex-basis:42px" data-profile-name="M" tabindex="0" role="button" aria-label="查看 M 的用户信息">M</span><i class="message-online "></i></span><span class="conversation-copy"><b>Mark <small class="conversation-level">LV.4</small></b><small class="conversation-username">@mark · 技术随笔版主</small><small class="conversation-preview">收到，谢谢！</small></span><em>昨天</em></button><button class="app-conversation " data-conversation="站务助手"><span class="message-avatar-wrap"><span class="avatar cyan" style="width:42px;height:42px;flex-basis:42px">站</span><i class="message-online is-online"></i></span><span class="conversation-copy"><b>站务助手 <small class="conversation-level">LV.5</small></b><small class="conversation-username">@bot · 官方账号</small><small class="conversation-preview">欢迎加入 BBLBB！有任何问题随时私信我。</small></span><em>3 天前</em></button></div></aside><section class="app-card app-chat"><header class="app-card__head app-chat__head"><div class="chat-identity"><span class="message-avatar-wrap"><span class="avatar cyan profile-hover-trigger" style="width:44px;height:44px;flex-basis:44px" data-profile-name="L" tabindex="0" role="button" aria-label="查看 L 的用户信息">L</span><i class="message-online is-online"></i></span><span><h2 data-chat-name="">Lin</h2><small>@linlv3 · LV.3 · 活跃成员</small></span></div><span class="sbadge sb-success">在线</span></header><div class="app-chat__body" data-chat-body=""><div class="bubble them">结论会在下次更新公告里公布。</div></div><footer class="app-chat__foot"><input class="app-field" data-chat-input="" placeholder="输入消息…" aria-label="消息内容"><button class="btn primary" data-send-message=""><svg class="ic ic-14" aria-hidden="true"><use href="#i-send"></use></svg>发送</button><small class="app-field-help" data-message-status="">消息会显示发送中、成功或失败重试状态。</small></footer></section></div>
</section>
