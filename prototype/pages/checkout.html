<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="BBLBB 社区原型 · 市场结算">
<meta name="theme-color" content="#F5F3EE" id="theme-color"><script>try{var p=localStorage.getItem("bblbb-theme")||"system";var t=p==="dark"||(p!=="light"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";document.documentElement.dataset.theme=t;document.documentElement.dataset.themePreference=p;document.documentElement.style.colorScheme=t;document.querySelector("#theme-color").setAttribute("content",t==="dark"?"#0D0D0D":"#F5F3EE")}catch(e){document.documentElement.dataset.theme="light"}</script><title>市场结算 · BBLBB 社区</title>
  <link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/prototype-app.css">
<link rel="stylesheet" href="../assets/prototype-workflows.css">
<link rel="stylesheet" href="../assets/chinese-elegance.css">
</head>
<body data-standalone="1">
<!-- 共享骨架（SVG sprite / 顶栏 / 底部导航 / Toast）由 assets/page-chrome.js 注入 -->
<script src="../assets/page-chrome.js"></script>
<main class="layout" id="main" tabindex="-1">
<!-- 本文件既是独立页面（浏览器可直接打开预览），也是 SPA 的模板来源（prototype-app.js 提取 section.page 的内容挂载） -->
<section class="page app-page app-route-checkout" id="page-checkout">
<div class="app-route-head"><div class="app-route-head__copy"><span class="app-kicker">MARKETPLACE / CHECKOUT</span><h1 tabindex="-1">确认接入</h1><p>确认 scope、限额、授权有效期和 Webhook 状态</p></div></div><section class="app-card"><header class="app-card__head"><h2>结算摘要</h2></header><div class="app-card__body"><div class="app-device"><div class="app-device__body"><b>BBLBB CLI 工具</b><span>openid · profile · 单笔限额 100</span></div><span class="sbadge sb-hot">待确认</span></div><div class="app-form-field"><label class="app-field-label" for="checkout-duration">授权有效期</label><select class="app-select" id="checkout-duration" aria-label="授权有效期"><option>30 天</option><option>永久</option></select></div><div class="app-form-field"><label class="app-field-label" for="checkout-reason">确认原因</label><textarea class="app-textarea" id="checkout-reason" aria-label="确认原因" placeholder="可选"></textarea></div><div class="app-form-actions"><button type="button" class="btn ghost" data-go-market="">取消</button><button type="button" class="btn primary" data-confirm-checkout="">确认并创建授权</button></div></div></section>
</section>
</main>
</body>
</html>
