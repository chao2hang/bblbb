<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="BBLBB 社区原型 · 购买记录">
<meta name="theme-color" content="#F5F3EE" id="theme-color"><script>try{var p=localStorage.getItem("bblbb-theme")||"system";var t=p==="dark"||(p!=="light"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";document.documentElement.dataset.theme=t;document.documentElement.dataset.themePreference=p;document.documentElement.style.colorScheme=t;document.querySelector("#theme-color").setAttribute("content",t==="dark"?"#0D0D0D":"#F5F3EE")}catch(e){document.documentElement.dataset.theme="light"}</script><title>购买记录 · BBLBB 社区</title>
  <link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/prototype-app.css">
<link rel="stylesheet" href="../assets/prototype-workflows.css">
<link rel="stylesheet" href="../assets/chinese-elegance.css">
</head>
<body data-standalone="1">
<!-- 共享骨架（SVG sprite / 顶栏 / 底部导航 / Toast）由 assets/page-chrome.js 注入 -->
<script src="../assets/page-chrome.js"></script>
<main class="layout" id="main" tabindex="-1">
<!-- 本文件既是独立页面（浏览器可直接打开预览），也是 SPA 的模板来源（prototype-app.js 提取 section.page 的内容挂载） -->
<section class="page app-page app-route-purchases" id="page-purchases">
<div class="app-page-head"><div class="app-page-head__copy"><span class="app-kicker">MARKETPLACE / PURCHASES</span><h1 tabindex="-1">市场购买记录</h1><p>交易、退款和 Webhook 投递状态</p></div></div><section class="app-card"><header class="app-card__head"><h2>交易记录</h2></header><div class="app-card__body"><div class="app-table-wrap"><table class="app-table"><tbody><tr><th>交易</th><th>金额</th><th>状态</th><th>Webhook</th><th>操作</th></tr><tr><td>BBLBB CLI 工具</td><td>10 B币</td><td><span class="sbadge sb-success">已完成</span></td><td>已投递</td><td><button type="button" class="btn danger" data-market-refund="">申请退款</button></td></tr><tr><td>团队知识库同步</td><td>0 B币</td><td><span class="sbadge sb-hot">处理中</span></td><td>重试 1/3</td><td><button type="button" class="btn ghost" data-market-retry="">重试 Webhook</button></td></tr></tbody></table></div></div></section>
</section>
</main>
</body>
</html>
