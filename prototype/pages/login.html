<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="BBLBB 社区原型 · 登录">
<meta name="theme-color" content="#F5F3EE" id="theme-color"><script>try{var p=localStorage.getItem("bblbb-theme")||"system";var t=p==="dark"||(p!=="light"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";document.documentElement.dataset.theme=t;document.documentElement.dataset.themePreference=p;document.documentElement.style.colorScheme=t;document.querySelector("#theme-color").setAttribute("content",t==="dark"?"#0D0D0D":"#F5F3EE")}catch(e){document.documentElement.dataset.theme="light"}</script><title>登录 · BBLBB 社区</title>
  <link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/prototype-app.css">
<link rel="stylesheet" href="../assets/prototype-workflows.css">
<link rel="stylesheet" href="../assets/chinese-elegance.css">
</head>
<body data-standalone="1">
<!-- 共享骨架（SVG sprite / 顶栏 / 底部导航 / Toast）由 assets/page-chrome.js 注入 -->
<script src="../assets/page-chrome.js"></script>
<main class="layout" id="main" tabindex="-1">
<!-- 本文件既是独立页面（浏览器可直接打开预览），也是 SPA 的模板来源（prototype-app.js 提取 section.page 的内容挂载） -->
<section class="page app-page app-route-login login-page" id="page-login">
<section class="login-shell"><div class="login-card"><p class="login-eyebrow">WELCOME BACK</p><h1 tabindex="-1">登录 BBLBB</h1><form data-auth-login=""><label class="login-field"><span>账号</span><input id="login-username" data-auth-user="" aria-label="账号" value="admin" autocomplete="username"><small data-auth-error=""></small></label><label class="login-field"><span>密码</span><input id="login-password" data-auth-password="" aria-label="密码" type="password" value="admin123" autocomplete="current-password"><small data-auth-password-error=""></small></label><p class="login-form-error" data-auth-form-error=""></p><button class="btn primary login-submit" type="submit">登录</button></form><p class="login-signup">还没有账号？ <a href="#register">立即注册</a></p><p class="login-signup"><a href="#forgot-password">忘记密码？</a></p></div></section>
</section>
</main>
</body>
</html>
