<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="BBLBB 社区原型：探索技术讨论、创作、消息与社区管理的完整体验。">
<meta name="theme-color" content="#F5F3EE" id="theme-color"><script>try{var p=localStorage.getItem("bblbb-theme")||"system";var t=p==="dark"||(p!=="light"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";document.documentElement.dataset.theme=t;document.documentElement.dataset.themePreference=p;document.documentElement.style.colorScheme=t;document.querySelector("#theme-color").setAttribute("content",t==="dark"?"#0D0D0D":"#F5F3EE")}catch(e){document.documentElement.dataset.theme="light"}</script><title>BBLBB 社区</title>
  <link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/prototype-app.css">
<link rel="stylesheet" href="assets/prototype-workflows.css">
<link rel="stylesheet" href="assets/chinese-elegance.css">
</head>
<body>
<a class="skip-link" href="#main">跳到主内容</a>
<!-- 共享骨架（SVG sprite / 顶栏 / 底部导航 / Toast）由 assets/page-chrome.js 注入 -->
<script src="assets/page-chrome.js"></script>
<div class="app-shell">
<main class="layout" id="main" tabindex="-1">

    <!-- ============ 加载页（boot 骨架，保留在入口） ============ -->
<section class="page loading-page" id="page-loading" hidden aria-labelledby="loading-title" aria-describedby="loading-description">
  <div class="loading-stage" role="status" aria-live="polite">
    <div class="loading-spinner" aria-hidden="true"></div>
    <h1 id="loading-title">加载中</h1>
    <p id="loading-description">请稍候…</p>
  </div>
</section>
    <!-- 页面主体拆分至 pages/*.html（每个路由一个文件，CSS 共用），
         由 assets/page-loader.js 启动时预载并注入；详见 ACCEPTANCE.md -->
    <section class="page" id="page-home"></section>
    <section class="page" id="page-discover" hidden></section>
    <section class="page" id="page-design" hidden></section>
</main>
</div>
<script src="assets/page-loader.js"></script>
</body></html>
