<body>

<canvas id="particles"></canvas>

<div class="shell">

      <span class="logo-mark">B</span>
      <div>
        <div class="brand-name">bblbb</div>
        <div class="brand-sub">管理后台 · 原型</div>
      </div>
    </div>
    <div class="nav-strip">
      <div class="nav-group">
        <div class="nav-group-label">总览</div>
        <a class="nav-item" href="index.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>总览</a>

        <div class="nav-group-label">内容管理</div>
        <a class="nav-item" href="users.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>创作者 <span class="nav-badge" id="badge-users">0</span></a>
        <a class="nav-item" href="projects.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>项目 <span class="nav-badge" id="badge-projects">0</span></a>
        <a class="nav-item" href="reviews.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>审核队列 <span class="nav-badge hot" id="badge-reviews">0</span></a>
      </div>
      <div class="nav-group">
        <div class="nav-group-label">运营</div>
        <a class="nav-item" href="announcements.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11l18-7v18l-18-7v-4z"/><path d="M7 14v5a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3"/></svg>公告中心</a>
        <a class="nav-item" href="orders.html"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>订单与账单</a>

      <div class="nav-group">

    </div>
    <div class="sidebar-foot">
      <div class="admin-card">
        <span class="admin-ava">陈</span>
        <div>
          <div class="admin-name">陈默</div>
          <div class="admin-role">超级管理员</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" data-action="logout"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>退出登录</button>

  </aside>

  <!-- ══ 主区域 ══ -->
  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="page-title">操作日志</h1>
        <div class="topbar-sub" id="page-sub"></div>
      </div>
      <div class="topbar-right">
        <span class="date-chip" id="date-chip"></span>
        <div class="bell-wrap">
          <button class="icon-btn" data-action="bell" aria-label="通知"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="bell-dot" id="bell-dot"></span></button>
          <div class="bell-menu" id="bell-menu">
            <div class="bell-menu-head">通知 <button data-action="bell-read">全部已读</button></div>
            <div class="bell-item"><span class="dot" style="background:var(--purple-light)"></span><div><b>3 条作品等待审核</b>其中 1 条提交于 1 小时前 <time>10 分钟前</time></div></div>
            <div class="bell-item"><span class="dot" style="background:var(--amber)"></span><div><b>白鹿 提交了冻结申诉</b>「希望恢复账号使用权限」 <time>昨天 21:14</time></div></div>
            <div class="bell-item"><span class="dot" style="background:var(--green)"></span><div><b>系统更新至 v2.9.0</b>协作空间支持语音批注 <time>2 天前</time></div></div>
          </div>
        </div>
        <a class="user-chip" href="settings.html" title="前往系统设置">
          <span class="admin-ava">陈</span>
          <div>
            <div class="nm">陈默</div>
            <div class="rl">超级管理员</div>
          </div>
        </a>
      </div>
    </header>
    <main class="content"><div class="page" id="page-root"></div></main>
  </div>
</div>

<div id="modal-root"></div>
<div class="toast-stack" id="toasts"></div>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/pages/logs.js"></script>
</body>
</html>
